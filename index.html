<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日日記帳"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" type="image/png" href="./icons/icon-192.png"><title>日日記帳 3.4｜貓咪咖啡廳</title><style>
:root{font-family:ui-rounded,'Noto Sans TC',system-ui,-apple-system,sans-serif;--bg:#fff8ef;--panel:#fff;--ink:#4c3d37;--muted:#9a8981;--accent:#b97958;--soft:#f6e5d6;--line:#efdfd2;--hero:#f6dfc9}*{box-sizing:border-box}body{margin:0;background:#eae5df;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding:20px 17px 105px;box-shadow:0 0 30px #0001}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.6}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:17px;margin:14px 0;box-shadow:0 5px 18px #47312308}.hero{background:var(--hero);border:0}.big{font-size:32px;font-weight:850;letter-spacing:-1px}.mascot{font-size:66px;display:block;text-align:center;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.bubble{background:#fff9;border-radius:16px;padding:12px;font-size:13px;line-height:1.7;flex:1}.pill{display:inline-block;border-radius:50px;background:var(--soft);color:var(--accent);padding:6px 10px;font-size:12px;font-weight:750}.primary{background:var(--accent);color:white;border-radius:15px;padding:13px 16px;font-weight:750}.secondary{background:var(--soft);color:var(--ink);border-radius:15px;padding:12px 14px;font-weight:700}.ghost{background:transparent;color:var(--accent);padding:8px}.danger{background:#fbe5e2;color:#a64d4b}.wide{width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff9;border-radius:16px;padding:13px}.tile strong{display:block;font-size:19px;margin-top:5px}.progress{height:11px;background:#eadfd5;border-radius:50px;overflow:hidden;margin:10px 0}.progress span{display:block;background:var(--accent);height:100%;border-radius:50px}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item .info{flex:1;min-width:0}.item .info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .amount{font-weight:800}.item .amount.in{color:#4e956e}.tiny{font-size:12px;color:var(--muted)}.iconbtn{border-radius:12px;padding:9px;background:var(--soft);color:var(--ink)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:5}.bottom button{background:transparent;color:var(--muted);padding:6px 1px;font-size:11px}.bottom button b{display:block;font-size:21px}.bottom button.active{color:var(--accent);font-weight:800}.field{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:72px}.modalWrap{position:fixed;inset:0;background:#281b1788;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.modal{background:var(--bg);border-radius:26px;padding:20px;width:min(460px,100%);max-height:calc(100dvh - 30px);overflow-y:auto;-webkit-overflow-scrolling:touch}.modal h2{margin-bottom:8px}.hide{display:none!important}.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.themeBtn{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:13px;text-align:left;color:var(--ink)}.themeBtn.selected{border-color:var(--accent);background:var(--soft)}.emoji{font-size:26px}.barrow{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}.barrow label{width:65px}.barrow .progress{flex:1;margin:0}.barrow small{width:70px;text-align:right}.notice{background:var(--soft);padding:12px;border-radius:15px;font-size:13px;line-height:1.6}.empty{text-align:center;color:var(--muted);padding:20px}.section{margin-top:23px}.badge{background:var(--soft);padding:12px;border-radius:14px;font-size:13px}input[type=file]{padding:8px}#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);max-width:90%;background:#443a34;color:white;padding:11px 17px;border-radius:14px;z-index:30;font-size:13px;text-align:center;display:none} .miniBtn{font-size:12px;padding:8px 10px}.choice{display:flex;gap:8px}.choice button{flex:1}.choice .selected{background:var(--accent);color:white} @media(min-width:550px){.app{border-radius:24px 24px 0 0}}
</style></head><body><div class="app"><header><div><div class="muted">每天一點點，夢想近一點 ✨</div><h1 id="appTitle">日日記帳 ☕</h1><small class="muted" style="font-size:11px">v3.5</small></div><button class="iconbtn" data-action="themes" aria-label="切換主題">🎨</button></header><main id="main"></main></div><nav class="bottom" id="nav"><button data-tab="home"><b>🏠</b>首頁</button><button data-tab="records"><b>🧾</b>明細</button><button data-tab="goals"><b>🌱</b>存錢</button><button data-tab="analysis"><b>📊</b>分析</button><button data-tab="settings"><b>⚙️</b>設定</button></nav><div id="overlay"></div><div id="toast" role="status"></div><script>
'use strict';
const KEY='daily-money-v3';const THEMES={cat:{name:'貓咪咖啡廳',emoji:'🐱',place:'咖啡廳',reward:'☕',bg:'#fff8ef',ink:'#4c3d37',accent:'#b97958',soft:'#f6e5d6',line:'#efdfd2',hero:'#f6dfc9',mascot:'🐈'},forest:{name:'森林養成',emoji:'🐿️',place:'森林',reward:'🌰',bg:'#f6f9ef',ink:'#344a38',accent:'#66966d',soft:'#e3efdb',line:'#d9e6d4',hero:'#dfedd5',mascot:'🐿️'},bunny:{name:'兔兔療癒',emoji:'🐰',place:'兔兔房間',reward:'🥕',bg:'#fff6f9',ink:'#614653',accent:'#d77e9b',soft:'#fae3eb',line:'#f2dbe3',hero:'#f9dce7',mascot:'🐇'},ocean:{name:'海洋探險',emoji:'🐠',place:'海底世界',reward:'🐚',bg:'#f0fbff',ink:'#305367',accent:'#4a9cb7',soft:'#d8f1f8',line:'#d3eaf2',hero:'#d1edf6',mascot:'🐬'},capy:{name:'水豚溫泉',emoji:'♨️',place:'溫泉旅館',reward:'🍊',bg:'#fcf8ee',ink:'#564a3a',accent:'#a9875b',soft:'#f1e7d5',line:'#e9decb',hero:'#f1e3c8',mascot:'🦫'},space:{name:'星空夢幻',emoji:'🌙',place:'星球基地',reward:'⭐',bg:'#f8f5ff',ink:'#48415f',accent:'#8971c0',soft:'#ebe3fb',line:'#e4ddf2',hero:'#e6dcf7',mascot:'🪐'}};
const CATS={food:['餐飲','🍱'],drink:['飲料','🧋'],shopping:['購物','🛍️'],transport:['交通','🚇'],home:['生活','🏡'],fun:['娛樂','🎮'],health:['健康','💊'],study:['學習','📚'],salary:['薪資','💼'],gift:['禮物','🎁'],other:['其他','✨']};
const blank=()=>({theme:'cat',budget:12000,records:[],goals:[],created:Date.now()});let state=blank(),tab='home',filterMonth=month(),search='';
function month(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function money(n){return 'NT$ '+Math.round(Number(n)||0).toLocaleString('zh-TW')};function safeAmount(v){const n=Number(v);return Number.isFinite(n)&&n>0&&n<=1e9?n:null};function sum(a){return a.reduce((x,r)=>x+Number(r.amount||0),0)};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'){state={...blank(),...v};if(!Array.isArray(state.records))state.records=[];if(!Array.isArray(state.goals))state.goals=[];if(!THEMES[state.theme])state.theme='cat'}}catch(e){console.warn('載入失敗',e)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('儲存失敗，請檢查瀏覽器儲存空間');return false}}function theme(){return THEMES[state.theme]||THEMES.cat}function applyTheme(){const t=theme(),r=document.documentElement.style;for(const k of ['bg','ink','accent','soft','line','hero'])r.setProperty('--'+k,t[k]);document.querySelector('meta[name="theme-color"]').content=t.bg;document.getElementById('appTitle').textContent='日日記帳 '+t.emoji}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2500)}function showTab(t){tab=t;render();window.scrollTo(0,0)}function current(){return state.records.filter(r=>r.date?.slice(0,7)===month())}function spent(){return sum(current().filter(r=>r.type==='expense'))}function income(){return sum(current().filter(r=>r.type==='income'))}function balance(){return income()-spent()}function expPercent(){return state.budget>0?Math.min(100,Math.round(spent()/state.budget*100)):0}function countStreak(){const days=new Set(state.records.map(r=>r.date));let d=new Date(today()+'T12:00:00');if(!days.has(today()))d.setDate(d.getDate()-1);let n=0;while(days.has(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))){n++;d.setDate(d.getDate()-1)}return n}
function render(){applyTheme();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('main').innerHTML=({home:homeView,records:recordsView,goals:goalsView,analysis:analysisView,settings:settingsView}[tab]||homeView)()}
function homeView(){const t=theme(),n=state.records.length,remain=state.budget-spent(),message=remain<0?'這個月稍微超出預算了，明天再慢慢調整就好 💗':n===0?'記下第一筆花費，我們一起開始吧！':`這個月還有 ${money(Math.max(0,remain))} 的預算，繼續加油！`;return `<section class="card hero"><div class="row"><div><span class="pill">${t.reward} ${esc(t.name)} · Lv.${1+Math.floor(n/8)}</span><h2 style="margin-top:12px">歡迎回來！</h2><div class="muted">今天也一起照顧荷包吧</div></div><span class="mascot">${t.mascot}</span></div><div class="bubble" style="margin-top:12px">${message}</div></section><section class="card"><div class="muted">本月已花費</div><div class="big">${money(spent())}</div><div class="grid2"><div class="tile"><span class="muted">本月收入</span><strong>${money(income())}</strong></div><div class="tile"><span class="muted">收支結餘</span><strong>${money(balance())}</strong></div></div><div class="row" style="margin-top:15px"><b>預算使用 ${expPercent()}%</b><span class="muted">${money(state.budget)}</span></div><div class="progress"><span style="width:${expPercent()}%"></span></div><div class="actions"><button class="primary" data-action="add">＋ 快速記帳</button><button class="secondary" data-action="quick">💬 一句話記帳</button></div></section><section class="card"><div class="row"><h2>🌟 今日小任務</h2><span class="pill">${n} ${t.reward}</span></div><p class="muted">每記一筆就收集一個${t.reward}，累積 8 筆升一級！</p><div class="progress"><span style="width:${n%8/8*100}%"></span></div><div class="grid2"><div class="tile">🔥 連續記帳<strong>${countStreak()} 天</strong></div><div class="tile">🏅 已解鎖徽章<strong>${badges().filter(b=>b.ok).length} / 4</strong></div></div></section><section class="section"><div class="row"><h2>最近紀錄</h2><button class="ghost" data-tab="records">查看全部 ›</button></div><div class="card">${listRecords([...state.records].sort(sortRecords).slice(0,4))}</div></section>`}
function sortRecords(a,b){return b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))}function listRecords(rs){if(!rs.length)return '<div class="empty">還沒有紀錄，按「＋ 快速記帳」開始吧 ✨</div>';return rs.map(r=>{const c=CATS[r.category]||CATS.other;return `<div class="item"><span class="emoji">${c[1]}</span><div class="info"><strong>${esc(r.note||c[0])}</strong><span class="tiny">${esc(r.date)} · ${c[0]} ${r.type==='income'?'· 收入':''}</span></div><div class="amount ${r.type==='income'?'in':''}">${r.type==='income'?'+':'−'}${money(r.amount)}</div><button class="iconbtn miniBtn" data-action="editRecord" data-id="${esc(r.id)}" aria-label="編輯紀錄">✏️</button><button class="iconbtn miniBtn" data-action="deleteRecord" data-id="${esc(r.id)}" aria-label="刪除紀錄">🗑️</button></div>`}).join('')}
function recordsView(){const arr=[...state.records].filter(r=>(!filterMonth||r.date?.startsWith(filterMonth))&&(`${r.note} ${CATS[r.category]?.[0]||''}`).toLowerCase().includes(search.toLowerCase())).sort(sortRecords);return `<div class="row section"><h2>🧾 收支明細</h2><button class="primary" data-action="add">＋ 新增</button></div><div class="card"><label class="field">篩選月份（清空可看全部）</label><input id="filterMonth" type="month" value="${esc(filterMonth)}"><label class="field">搜尋紀錄</label><input id="recordSearch" placeholder="例如：午餐、交通" value="${esc(search)}"><div class="row" style="margin-top:12px"><span class="muted">共 ${arr.length} 筆</span><button class="ghost" data-action="resetFilters">清除篩選</button></div></div><div class="card">${listRecords(arr)}</div>`}
function goalsView(){const t=theme();return `<section class="card hero"><div class="row"><div><span class="pill">${t.reward} ${esc(t.place)}</span><h2 style="margin-top:12px">一起存下小夢想</h2><div class="muted">每次存一點，都值得慶祝！</div></div><span class="mascot">${t.mascot}</span></div></section><div class="row section"><h2>🌱 我的存錢目標</h2><button class="primary" type="button" id="createGoalButton" data-action="addGoal">＋ 建立目標</button></div><section class="card" id="goalEditor" style="border:2px solid var(--accent)"><h2>🌱 建立存錢目標</h2><form id="goalForm"><input type="hidden" name="id" value=""><label class="field">夢想名稱</label><input name="name" maxlength="50" required placeholder="例如：沖繩旅行"><label class="field">夢想圖示</label><select name="emoji"><option>🎯</option><option>✈️</option><option>👜</option><option>🎁</option><option>🏠</option><option>🎮</option><option>📱</option><option>🎓</option><option>🐱</option></select><label class="field">目標金額（NT$）</label><input name="target" type="number" min="1" max="1000000000" step="1" inputmode="numeric" required placeholder="例如 10000"><button class="primary wide" style="margin-top:16px" type="submit">儲存目標 🌱</button></form></section>${state.goals.length?state.goals.map(g=>`<div class="card"><div class="row"><div><span class="emoji">${esc(g.emoji||'🎯')}</span> <b>${esc(g.name)}</b></div><span class="pill">${Math.min(100,Math.round(g.saved/g.target*100))}%</span></div><div class="big" style="font-size:25px;margin-top:12px">${money(g.saved)} <span class="muted">/ ${money(g.target)}</span></div><div class="progress"><span style="width:${Math.min(100,g.saved/g.target*100)}%"></span></div><div class="actions"><button class="primary" data-action="deposit" data-id="${esc(g.id)}">＋ 存一點</button><button class="secondary" data-action="withdraw" data-id="${esc(g.id)}">↩ 調整存款</button><button class="iconbtn" data-action="editGoal" data-id="${esc(g.id)}">✏️</button><button class="iconbtn" data-action="deleteGoal" data-id="${esc(g.id)}">🗑️</button></div></div>`).join(''):'<div class="card empty">還沒有存錢目標！<br>先建立一個旅行或購物的小夢想吧 💕</div>'}<div class="notice">💡 這裡的存款是「目標進度紀錄」，不會從銀行扣款，也不會自動列入收支明細。</div>`}
function analysisView(){const exp=current().filter(r=>r.type==='expense'),groups={};exp.forEach(r=>groups[r.category]=(groups[r.category]||0)+r.amount);const sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);return `<section class="section"><h2>📊 本月花費分析</h2></section><div class="card"><div class="muted">${esc(month())} 總支出</div><div class="big">${money(spent())}</div><div class="grid2"><div class="tile">💰 收入<strong>${money(income())}</strong></div><div class="tile">📌 支出筆數<strong>${exp.length} 筆</strong></div></div></div><div class="card"><h2>支出分類</h2>${sorted.length?sorted.map(([key,val])=>`<div class="barrow"><label>${CATS[key]?.[1]||'✨'} ${CATS[key]?.[0]||'其他'}</label><div class="progress"><span style="width:${spent()?val/spent()*100:0}%"></span></div><small>${money(val)}</small></div>`).join(''):'<div class="empty">本月還沒有支出資料</div>'}</div><div class="card"><h2>預算觀察</h2><p>${spent()>state.budget?'這個月已超出預算 '+money(spent()-state.budget)+'，不必自責，從下一筆開始調整就好。':'目前使用預算 '+expPercent()+'%，還有 '+money(state.budget-spent())+' 可以安排。'}</p><button class="secondary" data-action="budget">調整每月預算</button></div><div class="card"><h2>🏅 成就收藏</h2><div class="grid2">${badges().map(b=>`<div class="badge">${b.ok?'🏆':'🔒'} ${b.label}<div class="tiny">${b.ok?'已解鎖':'尚未解鎖'}</div></div>`).join('')}</div></div>`}function badges(){return [{label:'第一筆記帳',ok:state.records.length>=1},{label:'記帳小達人 · 10筆',ok:state.records.length>=10},{label:'連續 7 天',ok:countStreak()>=7},{label:'夢想存錢家',ok:state.goals.some(g=>g.saved>=g.target)}]}
function settingsView(){return `<section class="section"><h2>⚙️ 我的設定</h2></section><div class="card"><h2>🎨 主題世界</h2><p class="muted">目前：${theme().emoji} ${esc(theme().name)}，六個世界自由切換</p><button class="primary" data-action="themes">切換主題</button></div><div class="card"><h2>💰 每月預算</h2><div class="big">${money(state.budget)}</div><button class="secondary" data-action="budget">修改預算</button></div><div class="card"><h2>📦 資料備份與匯出</h2><p class="muted">資料僅存在目前瀏覽器，換裝置前請備份。</p><div class="actions"><button class="secondary" data-action="exportJson">⬇️ JSON 完整備份</button><button class="secondary" data-action="exportCsv">⬇️ CSV 明細</button></div><label class="field" for="importFile">還原 JSON 備份（會取代目前資料）</label><input type="file" id="importFile" accept=".json,application/json"></div><div class="card"><h2>🧹 資料管理</h2><p class="muted">清空後無法復原，建議先備份。</p><button class="secondary danger" data-action="clear">清除全部資料</button></div><div class="notice">日日記帳 3.0 · 單機離線版。沒有登入、雲端同步或銀行連線功能。遊戲獎勵是鼓勵記帳，不代表真實資產。</div>`}
function modal(title,body){document.getElementById('overlay').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row"><h2>${esc(title)}</h2><button class="iconbtn" data-action="close" aria-label="關閉">✕</button></div>${body}</div></div>`;requestAnimationFrame(()=>{const f=document.querySelector("#overlay input[name=amount],#overlay input[name=name]");if(f && !["goalForm","depositForm"].includes(f.closest("form")?.id))f.focus({preventScroll:true})})}function close(){document.getElementById('overlay').innerHTML=''}function confirmModal(title,description,fn){pending=fn;modal(title,`<p>${esc(description)}</p><div class="choice"><button class="secondary" data-action="close">先保留 🌷</button><button class="primary danger" data-action="confirm">確定刪除</button></div>`)}let pending=null;
function recordForm(id){const r=state.records.find(x=>x.id===id)||{type:'expense',amount:'',category:'food',note:'',date:today()};modal(id?'編輯紀錄':'新增記帳',`<form id="recordForm"><input type="hidden" name="id" value="${esc(id||'')}"><label class="field">收支類型</label><select name="type"><option value="expense" ${r.type==='expense'?'selected':''}>支出</option><option value="income" ${r.type==='income'?'selected':''}>收入</option></select><label class="field">金額（NT$）</label><input name="amount" type="number" min="1" max="1000000000" step="1" inputmode="decimal" required value="${esc(r.amount)}" placeholder="例如 120"><label class="field">分類</label><select name="category">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${r.category===k?'selected':''}>${v[1]} ${v[0]}</option>`).join('')}</select><label class="field">備註</label><input name="note" maxlength="100" placeholder="例如：午餐便當" value="${esc(r.note)}"><label class="field">日期</label><input name="date" type="date" required value="${esc(r.date)}"><button class="primary wide" style="margin-top:18px" type="submit">${id?'儲存修改':'新增這筆'} ✨</button></form>`)}
function quickForm(){modal('💬 一句話記帳',`<p class="muted">例如「午餐120、飲料45」或「捷運 30」，會自動建立支出紀錄。</p><form id="quickForm"><label class="field">今天花了什麼？</label><textarea name="text" required placeholder="午餐120、飲料45"></textarea><button class="primary wide" style="margin-top:12px">自動記帳 ✨</button></form>`)}function inferCat(s){if(/飲料|咖啡|奶茶|茶|果汁/.test(s))return'drink';if(/午餐|早餐|晚餐|便當|吃|麵|飯|餐/.test(s))return'food';if(/捷運|公車|車資|計程車|高鐵|火車|交通/.test(s))return'transport';if(/買|衣|鞋|購物/.test(s))return'shopping';if(/電影|遊戲|娛樂/.test(s))return'fun';if(/書|課|學/.test(s))return'study';return'other'}
function showGoalEditor(title,html){
  // iOS PWA: keep the form in a stable modal instead of rebuilding the entire tab.
  // Re-rendering the tab while handling the same tap could discard the form.
  modal(title,html);
}
function goalForm(id){
 const g=state.goals.find(x=>x.id===id)||{name:'',emoji:'🎯',target:'',saved:0};
 const html=`<section class="card" id="goalEditor" style="border:2px solid var(--accent)"><div class="row"><h2>${id?'編輯存錢目標':'🌱 建立存錢目標'}</h2><button type="button" class="secondary" data-action="cancelGoalEditor">取消</button></div><form id="goalForm"><input type="hidden" name="id" value="${esc(id||'')}"><label class="field">夢想名稱</label><input name="name" maxlength="50" required value="${esc(g.name)}" placeholder="例如：沖繩旅行"><label class="field">夢想圖示</label><select name="emoji">${['🎯','✈️','👜','🎁','🏠','🎮','📱','🎓','🐱'].map(e=>`<option ${g.emoji===e?'selected':''}>${e}</option>`).join('')}</select><label class="field">目標金額（NT$）</label><input name="target" type="number" min="1" max="1000000000" step="1" inputmode="numeric" required value="${esc(g.target)}" placeholder="例如 10000"><button class="primary wide" style="margin-top:16px" type="submit">儲存目標 🌱</button></form></section>`;
 const old=document.getElementById('goalEditor');if(old)old.remove();
 const anchor=document.getElementById('createGoalButton');if(!anchor){toast('無法找到存錢頁面，請重新進入存錢');return;}
 anchor.closest('.row').insertAdjacentHTML('afterend',html);
 document.getElementById('goalEditor').scrollIntoView({block:'nearest',behavior:'instant'});
}
function depositForm(id,withdraw=false){const g=state.goals.find(x=>x.id===id);if(!g)return;showGoalEditor(withdraw?'調整存款':'＋ 存一點',`<p>目標：<b>${esc(g.name)}</b><br>目前已存 ${money(g.saved)}</p><form id="depositForm"><input type="hidden" name="id" value="${esc(id)}"><input type="hidden" name="direction" value="${withdraw?'withdraw':'deposit'}"><label class="field">${withdraw?'減少':'存入'}金額（NT$）</label><input name="amount" type="number" min="1" max="1000000000" step="1" inputmode="numeric" required placeholder="例如 500"><button class="primary wide" style="margin-top:16px" type="submit">${withdraw?'確認調整':'存入 🌱'}</button></form>`)}
function themeModal(){modal('🎨 選擇你的世界',`<p class="muted">六個主題共用同一份記帳資料，隨時自由切換。</p><div class="themes">${Object.entries(THEMES).map(([id,t])=>`<button class="themeBtn ${id===state.theme?'selected':''}" data-action="selectTheme" data-id="${id}"><div class="emoji">${t.emoji}</div><b>${t.name}</b><div class="tiny">${t.place}</div></button>`).join('')}</div>`)}function budgetModal(){modal('設定每月預算',`<form id="budgetForm"><label class="field">每月預算（NT$）</label><input type="number" name="budget" min="1" max="1000000000" required step="1" value="${esc(state.budget)}"><button class="primary wide" style="margin-top:15px">儲存預算</button></form>`)}
function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function validateBackup(v){if(!v||typeof v!=='object'||!Array.isArray(v.records)||!Array.isArray(v.goals))throw Error('備份格式不正確');if(v.records.length>100000||v.goals.length>10000)throw Error('備份資料過大');const records=v.records.map(r=>{if(!r||!['income','expense'].includes(r.type)||!safeAmount(r.amount)||!/^\d{4}-\d{2}-\d{2}$/.test(r.date))throw Error('紀錄格式有誤');return{id:uid(),type:r.type,amount:Number(r.amount),category:CATS[r.category]?r.category:'other',note:String(r.note||'').slice(0,100),date:r.date}});const goals=v.goals.map(g=>{if(!g||!safeAmount(g.target)||!Number.isFinite(Number(g.saved))||Number(g.saved)<0)throw Error('存錢目標格式有誤');return{id:uid(),name:String(g.name||'目標').slice(0,50),emoji:['🎯','✈️','👜','🎁','🏠','🎮','📱','🎓','🐱'].includes(g.emoji)?g.emoji:'🎯',target:Number(g.target),saved:Number(g.saved)}});return{...blank(),theme:THEMES[v.theme]?v.theme:'cat',budget:safeAmount(v.budget)||12000,records,goals}}
function action(a,id){switch(a){case'close':close();break;case'add':recordForm();break;case'quick':quickForm();break;case'editRecord':recordForm(id);break;case'deleteRecord':{const r=state.records.find(x=>x.id===id);if(r)confirmModal('刪除這筆紀錄？',`${r.note||CATS[r.category]?.[0]||'紀錄'} ${money(r.amount)}。刪除後收支與分析會重新計算。`,()=>{state.records=state.records.filter(x=>x.id!==id);save();render();toast('已刪除紀錄')});break}case'cancelGoalEditor':render();break;case'addGoal':document.querySelector('#goalEditor input[name=name]')?.focus();document.getElementById('goalEditor')?.scrollIntoView({block:'center',behavior:'smooth'});break;case'editGoal':goalForm(id);break;case'deleteGoal':{const g=state.goals.find(x=>x.id===id);if(g)confirmModal('刪除存錢目標？',`「${g.name}」及其累積進度將被移除。`,()=>{state.goals=state.goals.filter(x=>x.id!==id);save();render();toast('目標已刪除')});break}case'deposit':depositForm(id);break;case'withdraw':depositForm(id,true);break;case'themes':themeModal();break;case'selectTheme':if(THEMES[id]){state.theme=id;save();close();render();toast('已切換到 '+theme().name)}break;case'budget':budgetModal();break;case'confirm':{const fn=pending;pending=null;close();if(fn)fn();break}case'resetFilters':filterMonth='';search='';render();break;case'exportJson':download('日日記帳-完整備份-'+today()+'.json',JSON.stringify(state,null,2),'application/json');toast('備份已下載');break;case'exportCsv':{const rows=[['日期','類型','分類','備註','金額'],...state.records.map(r=>[r.date,r.type==='income'?'收入':'支出',CATS[r.category]?.[0]||'其他',r.note,r.amount])];download('日日記帳-明細-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV 已下載');break}case'clear':confirmModal('清除所有資料？','所有記帳、存錢目標與設定將被清空，此操作無法復原。',()=>{state=blank();filterMonth=month();search='';save();render();toast('資料已清空')});break}}
document.addEventListener('click',e=>{const b=e.target instanceof Element?e.target.closest('button'):null;if(!b)return;if(b.dataset.tab||b.dataset.action){if(b.type!=='submit')e.preventDefault();try{if(b.dataset.tab){showTab(b.dataset.tab);return}action(b.dataset.action,b.dataset.id)}catch(err){console.error('按鈕操作錯誤',err);toast('操作出錯：'+(err.message||'未知錯誤'))}}});document.addEventListener('submit',e=>{const form=e.target;if(!['recordForm','quickForm','goalForm','depositForm','budgetForm'].includes(form.id))return;e.preventDefault();const f=new FormData(form);const snapshot=JSON.stringify(state);try{if(form.id==='recordForm'){const amount=safeAmount(f.get('amount')),date=String(f.get('date')),type=String(f.get('type'));if(!amount||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['income','expense'].includes(type))throw Error('請輸入正確金額與日期');const id=String(f.get('id'));const obj={id:id||uid(),type,amount,category:CATS[f.get('category')]?f.get('category'):'other',note:String(f.get('note')||'').slice(0,100),date};const idx=state.records.findIndex(r=>r.id===id);if(idx>=0)state.records[idx]=obj;else state.records.push(obj)}else if(form.id==='quickForm'){const parts=String(f.get('text')||'').split(/[、，,;；\n]+/).map(x=>x.trim()).filter(Boolean);if(!parts.length)throw Error('請輸入內容');const parsed=parts.map(p=>{const m=p.match(/^(.*?)(?:\s|\$|NT\$)*([0-9]+(?:\.[0-9]+)?)\s*(?:元)?$/);if(!m||!safeAmount(m[2]))throw Error('無法辨識「'+p+'」，請使用「午餐120」格式');const note=m[1].trim()||'日常支出';return{id:uid(),type:'expense',amount:Number(m[2]),category:inferCat(note),note,date:today()}});state.records.push(...parsed)}else if(form.id==='goalForm'){const target=safeAmount(f.get('target')),name=String(f.get('name')||'').trim();if(!target||!name)throw Error('請輸入名稱與目標金額');const id=String(f.get('id')),idx=state.goals.findIndex(g=>g.id===id),old=state.goals[idx];const obj={id:id||uid(),name:name.slice(0,50),emoji:String(f.get('emoji')||'🎯'),target,saved:old?.saved||0};if(idx>=0)state.goals[idx]=obj;else state.goals.push(obj)}else if(form.id==='depositForm'){const g=state.goals.find(g=>g.id===f.get('id')),amount=safeAmount(f.get('amount'));if(!g||!amount)throw Error('金額不正確');if(f.get('direction')==='withdraw'){if(amount>g.saved)throw Error('調整金額不能超過已存金額');g.saved-=amount}else g.saved+=amount}else if(form.id==='budgetForm'){const n=safeAmount(f.get('budget'));if(!n)throw Error('請輸入正確預算');state.budget=n}const wasDeposit=form.id==='depositForm';const goalName=wasDeposit?state.goals.find(g=>g.id===f.get('id'))?.name:'';const savedOk=save();if(!savedOk){state=JSON.parse(snapshot);throw Error('無法儲存資料，請先備份並檢查手機儲存空間')}close();render();toast(wasDeposit?'存錢成功！'+(goalName?' '+goalName:'')+' '+theme().reward:'完成啦！'+theme().reward)}catch(err){toast(err.message||'操作失敗');const f=document.querySelector('#goalEditor form, #overlay form');if(f){let hint=f.querySelector('.formError');if(!hint){hint=document.createElement('p');hint.className='formError';hint.style.color='#b44444';f.appendChild(hint)}hint.textContent=err.message||'操作失敗'}}});document.addEventListener('change',async e=>{if(e.target.id==='filterMonth'){filterMonth=e.target.value;render()}if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('檔案超過 10MB');const v=validateBackup(JSON.parse(await file.text()));pending=()=>{state=v;save();render();toast('備份還原成功')};modal('確定還原備份？','<p>這會取代目前所有記帳和存錢目標。建議先下載目前的 JSON 備份。</p><div class="choice"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="confirm">確定還原</button></div>')}catch(err){toast(err.message||'備份讀取失敗')}}});document.addEventListener('input',e=>{if(e.target.id==='recordSearch'){search=e.target.value;const p=e.target.selectionStart;render();const input=document.getElementById('recordSearch');input.focus();input.setSelectionRange(p,p)}});load();render();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));}</script></body></html>
